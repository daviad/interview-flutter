# =============================================================================
# moviely_feature_favorite —— 收藏业务模块（对标独立仓 feature-favorite）
# =============================================================================
# 纯本地数据模块：用 shared_preferences 持久化收藏列表，不走网络。
# 暴露 favoriteRepositoryProvider 供 feature_detail 调用（toggle 收藏）。
name: moviely_feature_favorite
description: 收藏 feature：shared_preferences 持久化 + 列表展示
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^15.0.0
  shared_preferences: ^2.3.2
  moviely_core_launch:
    path: ../../core/core_launch
  moviely_core_domain:
    path: ../../core/core_domain
  moviely_core_ui:
    path: ../../core/core_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
