# =============================================================================
# moviely_feature_test —— 练习用 test tab 模块
# =============================================================================
# 组件化铁律：本包永不依赖 app / app_launch；只依赖 core_* 基础包。
name: moviely_feature_test
description: 练习 feature：底部第 4 个 tab，image_picker 选择相册照片并展示
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

# pub workspace 成员标记
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^15.0.0
  # 官方图片选择器：Android/iOS 走系统相册（PHPicker / Photo Picker），
  # Windows/macOS/Linux 桌面端内部包装 file_selector，弹系统文件选择对话框。
  image_picker: ^1.2.2
  moviely_core_launch:
    path: ../../core/core_launch

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
