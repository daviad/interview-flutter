# =============================================================================
# moviely_core_ui —— 公共 UI 层（对标 component-moviely 的 common/common-ui）
# =============================================================================
# MovielyTheme + 跨 feature 共享的无业务状态组件（Loading/Error/空态/电影卡片）。
# 依赖 core_domain 只为读取 Movie 模型（组件入参），不依赖任何 feature。
name: moviely_core_ui
description: Moviely 主题与共享 UI 组件
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

# pub workspace 成员标记
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.0
  moviely_core_domain:
    path: ../core_domain

dev_dependencies:
  flutter_lints: ^6.0.0
